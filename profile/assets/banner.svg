<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="MITS LAB — Biomedical Ultrasound, Inje University">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12233d"/>
    </linearGradient>
    <linearGradient id="sector" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- B-mode sector: apex at (1000,30), radius 250, opening about 70 degrees -->
  <path d="M 1000 30 L 857 235 A 250 250 0 0 0 1143 235 Z" fill="url(#sector)"/>
  <g stroke="#bae6fd" stroke-opacity="0.35" stroke-width="1">
    <path d="M1000 30 L857 235"/><path d="M1000 30 L905 261"/><path d="M1000 30 L952 275"/><path d="M1000 30 L1000 280"/>
    <path d="M1000 30 L1048 275"/><path d="M1000 30 L1095 261"/><path d="M1000 30 L1143 235"/>
  </g>
  <g fill="none" stroke="#e0f2fe" stroke-opacity="0.5" stroke-width="1">
    <path d="M 931 128 A 120 120 0 0 0 1069 128"/>
    <path d="M 891 185 A 190 190 0 0 0 1109 185"/>
  </g>
  <g fill="#e0f2fe" fill-opacity="0.4">
    <circle cx="950" cy="170" r="1.5"/><circle cx="1030" cy="150" r="1.2"/><circle cx="1070" cy="215" r="1.6"/>
    <circle cx="925" cy="230" r="1.1"/><circle cx="1000" cy="245" r="1.4"/><circle cx="1105" cy="245" r="1.2"/>
    <circle cx="975" cy="105" r="1.0"/><circle cx="1045" cy="195" r="1.3"/><circle cx="910" cy="255" r="1.2"/>
  </g>

  <!-- RF pulse waveform -->
  <path d="M40 235 H210 c6 0 6-60 12-60 s6 120 12 120 s6-150 12-150 s6 170 12 170 s6-120 12-120 s6 70 12 70 s6-30 12-30 s6 10 12 10 H700"
        fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 235 H700" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1"/>

  <text x="40" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="1">MITS LAB</text>
  <text x="40" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#bae6fd">Biomedical Ultrasound · Inje University</text>
  <text x="40" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">imaging systems · beamforming · high-frequency ultrasound · photoacoustics · therapy · AI</text>
</svg>
